{% extends "base.html" %}

{% block title %}Listado de Cursos{% endblock %}


{% block content %}
    <ul>
    {% for curso in cursos %}
        <li>
        <a href="{% url 'cursos:detalle' curso.pk %}"> {{curso.nombre}}</a>
        </li>
    {% empty %}
        <li>No hay cursos disponibles!!</li>
    {% endfor %}
    </ul>
    <a href="{% url 'cursos:crear' %}">Crear</a>

{% endblock%}
